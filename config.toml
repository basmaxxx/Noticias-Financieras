# Configuración del resumen financiero semanal.
# Las fuentes se listan en orden de prioridad: cuando varias notas cubren la misma
# historia, el título que se muestra es el de la fuente que aparece primero.

[general]
timezone = "America/Argentina/Buenos_Aires"
post_time = "13:00"        # hora local de publicación en Discord
max_wait_minutes = 120     # si el job arranca antes, espera hasta post_time (como máximo esto)
lookback_days = 7

[llm]
model = "gpt-6.1-terra"     # OpenAI: modelo principal para redacción y análisis
effort = "high"
max_output_tokens = 64000
timeout_seconds = 600
max_stories = 600          # historias (ya agrupadas) que se envían al modelo
max_companies = 8          # empresas con análisis fundamental

[market]
max_age_days = 5           # cotizaciones más viejas que esto se descartan (dato desactualizado)
yield_tickers = ["^TNX"]   # se muestran en puntos básicos, no en %

[market.ccl]
name = "Dólar CCL (GGAL)"
local = "GGAL.BA"
adr = "GGAL"
ratio = 10

[market.groups."Índices"]
